[package]
name = "mls-spec"
version = "3.0.0-pre.11"
description = "This crate is a repository of MLS / RFC9420-related data structures."
readme = "README.md"
documentation = "https://docs.rs/mls-spec"
repository = "https://github.com/OtaK/mls-spec"
license = "MIT OR Apache-2.0"
keywords = ["mls", "e2ee", "rfc9420", "spec", "tlspl"]
categories = ["cryptography", "parser-implementations", "encoding"]
authors = ["Mathieu Amiot <amiot.mathieu@gmail.com>"]
edition = "2024"
include = ["src/**/*", "LICENSE-*", "README.md"]
rust-version = "1.85"

[package.metadata.docs.rs]
features = [
    "all-drafts",
    "mls-rs-compat",
    "serde",
]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]

[features]
default = ["std"]
# Used when developing locally
all-drafts = [
    "mls-extensions",
    "draft-ietf-mls-combiner",
    "draft-ietf-mls-partial",
    "draft-ietf-mls-targeted-messages",
    "draft-ietf-mls-ratchet-tree-options",
    "draft-kohbrok-mls-associated-parties",
    "draft-mahy-mls-semiprivatemessage",
    "draft-mahy-mls-sd-cwt-credential",
    "draft-mahy-mls-private-external",
    "draft-mahy-mls-new-content-types",
    "draft-mularczyk-mls-splitcommit",
    "draft-pham-mls-additional-wire-formats",
    "draft-kohbrok-mls-leaf-operation-intents"
]
alloc = []
std = ["alloc"]
hazmat = []
test-vectors = []
test-utils = ["dep:pretty_assertions", "dep:color-eyre", "dep:postcard", "dep:serde_json"]
serde = ["dep:serde", "dep:serde_repr", "zeroize/serde"]
mls-rs-compat = ["dep:mls-rs-codec"]
mls-extensions = [
    "draft-ietf-mls-extensions",
] # Prep transition from draft to RFC
# MLS-related drafts implemented in-tree
draft-ietf-mls-extensions = [] # draft-10
draft-ietf-mls-extensions-content-advertisement-parse = [
    "draft-ietf-mls-extensions",
    "dep:mediatype",
]
draft-ietf-mls-combiner = ["draft-ietf-mls-extensions"] # draft-02++ @ git:c511d87
draft-ietf-mls-targeted-messages = [] # draft-01
draft-ietf-mls-partial = [] # draft-02
draft-ietf-mls-ratchet-tree-options = [] # draft-01
draft-kohbrok-mls-associated-parties = [
    "draft-ietf-mls-extensions",
] # draft-00++
draft-kohbrok-mls-leaf-operation-intents = [] # draft-01
draft-mahy-mls-new-content-types = [] # draft-01
draft-mahy-mls-private-external = [] # draft-00
draft-mahy-mls-ratchet-tree-options = ["draft-ietf-mls-ratchet-tree-options"] # draft-04 == ietf-draft-00 alias
draft-mahy-mls-semiprivatemessage = ["draft-ietf-mls-extensions"] # draft-07
draft-mahy-mls-sd-cwt-credential = [] # draft-02
draft-mularczyk-mls-splitcommit = [] # draft-00
draft-pham-mls-additional-wire-formats = [
    "draft-ietf-mls-extensions",
] # draft-00++

[dependencies]
thiserror = "2"
miette = "7"
async-trait = "0.1"
strum = { version = "0.28", features = ["derive"] }
thalassa = { version = "0.0.4", features = ["derive"] }
static_assertions = "1.1"
subtle = "2.6"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
mediatype = { version = "0.23", default-features = false, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_repr = { version = "0.1", optional = true }
mls-rs-codec = { version = "0.7", optional = true }
pretty_assertions = { version = "1.4", optional = true }
color-eyre = { version = "0.6", optional = true }
postcard = { version = "1", features = ["use-std"], optional = true }
serde_json = { version = "1", features = ["preserve_order"], optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"

[[test]]
name = "spec-test-vectors"
required-features = ["test-utils", "test-vectors", "serde"]
harness = false

[dev-dependencies]
mls-spec = { path = ".", features = ["test-utils", "test-vectors", "serde"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
pretty_assertions = "1.4"
color-eyre = "0.6"
libtest-mimic = "0.8"
convert_case = "0.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-error = "0.2"
faster-hex = { version = "0.10", features = ["serde"] }
